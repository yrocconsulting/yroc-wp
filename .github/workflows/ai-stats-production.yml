# Weekly AI visibility stats for the live yrocconsulting.com homepage.
# Same report and scripts as yrocconsulting/staging's ai-stats.yml (which also feeds the portal);
# this job only updates the live site.
name: Weekly AI stats (production)

on:
  schedule:
    # The report lands around 9 am Central on Mondays. Cron runs in UTC: these are 10:15 am and
    # 7:15 pm Central in winter (CST), an hour later in summer. Staging runs 10 minutes earlier.
    - cron: "15 16 * * 1"   # Monday morning
    - cron: "15 1 * * 2"    # Monday evening backup (01:15 UTC Tuesday)
  workflow_dispatch:

concurrency:
  group: siteground
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRIVE_FOLDER: 1HMP4uk0PNoCAT7rU4QUGvRBBDBuDm_ud
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yrocconsulting/staging

      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Read newest report
        run: |
          python3 tools/prt_report.py --drive-folder "$DRIVE_FOLDER" > stats.json
          python3 -c "import json;d=json.load(open('stats.json'));print('report', d.get('report_date'), 'appearances', d.get('appearances'))"

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_siteground
          chmod 600 ~/.ssh/id_siteground
          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/id_siteground > /dev/null
          fi
          ssh-keyscan -p "${SSH_PORT:-18765}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<CFG
          Host siteground
            HostName $SSH_HOST
            Port ${SSH_PORT:-18765}
            User $SSH_USER
            IdentityFile ~/.ssh/id_siteground
            IdentitiesOnly yes
          CFG

      - name: Update live site stats
        run: |
          ssh siteground 'mkdir -p ~/yroc-deploy-prod'
          rsync -az deploy/apply_ai_stats.php stats.json siteground:yroc-deploy-prod/
          ssh siteground 'export PATH=$HOME/yroc-bin:$PATH; cd ~/www/yrocconsulting.com/public_html \
            && wp eval-file ~/yroc-deploy-prod/apply_ai_stats.php ~/yroc-deploy-prod/stats.json \
            && (wp sg purge 2>/dev/null || true)'

      - name: Clear Sucuri cache
        if: success()
        env:
          SUCURI_API_KEY: ${{ secrets.SUCURI_API_KEY }}
          SUCURI_API_SECRET: ${{ secrets.SUCURI_API_SECRET }}
        run: |
          if [ -z "$SUCURI_API_KEY" ] || [ -z "$SUCURI_API_SECRET" ]; then echo "::notice::Sucuri secrets not set; skipping."; exit 0; fi
          curl -sS --max-time 60 'https://waf.sucuri.net/api?v2' --data-urlencode "k=$SUCURI_API_KEY" \
            --data-urlencode "s=$SUCURI_API_SECRET" --data 'a=clear_cache' > sucuri.json
          python3 -c "import json,sys;d=json.load(open('sucuri.json'));print('Sucuri:', ' '.join(map(str,d.get('messages',[]))));sys.exit(0 if str(d.get('status'))=='1' else 1)"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_siteground
