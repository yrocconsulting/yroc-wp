# Deploys the theme and content from yrocconsulting/staging to the live yrocconsulting.com.
# Run manually (Actions -> Deploy to production) after checking the change on staging.
name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or commit of yrocconsulting/staging (blank = its default branch)"
        default: ""
      force_content:
        description: "Overwrite pages even if they were edited in WordPress"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: siteground
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yrocconsulting/staging
          ref: ${{ inputs.source_ref }}

      - uses: actions/checkout@v4
        with:
          path: ops

      - name: Lint PHP
        run: find theme deploy -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_siteground
          chmod 600 ~/.ssh/id_siteground
          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/id_siteground > /dev/null
          fi
          ssh-keyscan -p "${SSH_PORT:-18765}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<CFG
          Host siteground
            HostName $SSH_HOST
            Port ${SSH_PORT:-18765}
            User $SSH_USER
            IdentityFile ~/.ssh/id_siteground
            IdentitiesOnly yes
            ServerAliveInterval 30
          CFG

      - name: Upload theme and content
        run: |
          echo "Deploying yrocconsulting/staging @ $(git rev-parse --short HEAD)"
          rsync -az --delete --exclude '.DS_Store' theme/yroc/ siteground:www/yrocconsulting.com/public_html/wp-content/themes/yroc/
          ssh siteground 'mkdir -p ~/yroc-deploy-prod/content'
          rsync -az deploy/import.php siteground:yroc-deploy-prod/import.php
          rsync -az --delete --exclude '.DS_Store' content/ siteground:yroc-deploy-prod/content/

      - name: Import content
        run: |
          FORCE=${{ inputs.force_content && '1' || '0' }}
          ssh siteground "export PATH=\$HOME/yroc-bin:\$PATH; cd ~/www/yrocconsulting.com/public_html \
            && wp eval 'wp_get_theme()->delete_pattern_cache();' \
            && YROC_FORCE=$FORCE wp eval-file ~/yroc-deploy-prod/import.php ~/yroc-deploy-prod/content \
            && wp cache flush \
            && (wp sg purge 2>/dev/null || true)"

      - name: Clear Sucuri cache
        if: success()
        env:
          SUCURI_API_KEY: ${{ secrets.SUCURI_API_KEY }}
          SUCURI_API_SECRET: ${{ secrets.SUCURI_API_SECRET }}
        run: |
          if [ -z "$SUCURI_API_KEY" ] || [ -z "$SUCURI_API_SECRET" ]; then echo "::notice::Sucuri secrets not set; skipping."; exit 0; fi
          curl -sS --max-time 60 'https://waf.sucuri.net/api?v2' --data-urlencode "k=$SUCURI_API_KEY" \
            --data-urlencode "s=$SUCURI_API_SECRET" --data 'a=clear_cache' > sucuri.json
          python3 -c "import json,sys;d=json.load(open('sucuri.json'));print('Sucuri:', ' '.join(map(str,d.get('messages',[]))));sys.exit(0 if str(d.get('status'))=='1' else 1)"

      - name: Check the live site
        run: |
          code=$(curl -s -o page.html -w '%{http_code}' "https://yrocconsulting.com/?v=$GITHUB_RUN_ID")
          grep -q 'themes/yroc/' page.html || { echo "::error::Homepage did not render the theme (HTTP $code)"; exit 1; }
          echo "Homepage OK (HTTP $code)."

      - name: Record what is live
        run: |
          git rev-parse HEAD > ops/.deploy/production-sha
          cd ops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/production-sha
          git diff --cached --quiet || { git commit -m "Live site now at staging $(cut -c1-7 .deploy/production-sha)"; git push; }

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_siteground
